name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: keyword

jobs:
  verify:
    name: verify-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxi-dev \
            libxrandr-dev \
            pkg-config

      - name: run tests
        run: cargo test --locked

  build-windows:
    name: build-windows-x64
    runs-on: windows-latest
    needs: verify

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: build release
        run: cargo build --release --locked

      - name: package release
        shell: pwsh
        run: |
          $packageName = "${{ env.APP_NAME }}-windows-x64"
          $packageDir = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "target/release/${{ env.APP_NAME }}.exe" (Join-Path $packageDir "${{ env.APP_NAME }}.exe")
          Copy-Item "README.md" (Join-Path $packageDir "README.md")
          Compress-Archive -Path "$packageDir/*" -DestinationPath "dist/$packageName.zip"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyword-windows-x64
          path: dist/keyword-windows-x64.zip

  build-linux:
    name: build-linux-x64
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxi-dev \
            libxrandr-dev \
            pkg-config

      - name: build release
        run: cargo build --release --locked

      - name: package release
        run: |
          package_name="${APP_NAME}-linux-x64"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}"
          cp "target/release/${APP_NAME}" "${package_dir}/${APP_NAME}"
          cp "README.md" "${package_dir}/README.md"
          tar -czf "dist/${package_name}.tar.gz" -C dist "${package_name}"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyword-linux-x64
          path: dist/keyword-linux-x64.tar.gz

  build-macos:
    name: build-macos-universal
    runs-on: macos-latest
    needs: verify

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: build macOS x64
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: build macOS arm64
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: create universal binary
        run: |
          mkdir -p dist/keyword-macos-universal
          lipo -create \
            "target/x86_64-apple-darwin/release/${APP_NAME}" \
            "target/aarch64-apple-darwin/release/${APP_NAME}" \
            -output "dist/keyword-macos-universal/${APP_NAME}"
          cp "README.md" "dist/keyword-macos-universal/README.md"
          tar -czf "dist/keyword-macos-universal.tar.gz" -C dist "keyword-macos-universal"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyword-macos-universal
          path: dist/keyword-macos-universal.tar.gz

  checksums:
    name: generate-checksums
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
      - build-macos

    steps:
      - name: download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: generate sha256
        run: |
          find release-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} . \;
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyword-checksums
          path: SHA256SUMS.txt

  release-assets:
    name: sign-assets
    runs-on: ubuntu-latest
    needs:
      - checksums

    steps:
      - name: download checksums
        uses: actions/download-artifact@v4
        with:
          name: keyword-checksums
          path: assets

      - name: download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: collect signable files
        run: |
          mkdir -p sign-dir
          find release-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} sign-dir/ \;
          cp assets/SHA256SUMS.txt sign-dir/SHA256SUMS.txt

      - name: generate minisign checksums
        uses: jmgilman/actions-generate-checksum@v1
        with:
          output: sign-dir/CHECKSUMS.txt
          patterns: |
            sign-dir/*.zip
            sign-dir/*.tar.gz
            sign-dir/SHA256SUMS.txt

      - name: upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyword-signed-assets
          path: sign-dir/*

  release:
    name: publish-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - release-assets

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: keyword-signed-assets
          path: publish

      - name: generate changelog
        id: changelog
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v' | head -2 | tail -1 || echo "")

          echo "## What's Changed" >> CHANGELOG_BODY.md

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "" >> CHANGELOG_BODY.md
            echo "**Full Changelog**: ${PREVIOUS_TAG}...${TAG_NAME}" >> CHANGELOG_BODY.md
            echo "" >> CHANGELOG_BODY.md

            git log "${PREVIOUS_TAG}..${TAG_NAME}" --pretty=format:"%s" --reverse >> CHANGELOG_BODY.md
          else
            echo "" >> CHANGELOG_BODY.md
            echo "This is the first release." >> CHANGELOG_BODY.md
            echo "" >> CHANGELOG_BODY.md

            git log --pretty=format:"%s" --reverse >> CHANGELOG_BODY.md
          fi

          echo "" >> CHANGELOG_BODY.md
          echo "## Assets" >> CHANGELOG_BODY.md
          echo "" >> CHANGELOG_BODY.md
          echo "| File | SHA256 |" >> CHANGELOG_BODY.md
          echo "|------|--------|" >> CHANGELOG_BODY.md

          if [ -f publish/SHA256SUMS.txt ]; then
            while IFS=' ' read -r hash filename; do
              echo "| ${filename} | ${hash} |" >> CHANGELOG_BODY.md
            done < publish/SHA256SUMS.txt
          fi

      - name: generate release body
        id: release_body
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}

          cat > RELEASE_BODY.md << 'EOF'
          ## Keyword Composer ${TAG_NAME}

          关键词组合桌面工具 - Rust + eframe/egui

          EOF

          cat CHANGELOG_BODY.md >> RELEASE_BODY.md

          cat >> RELEASE_BODY.md << 'EOF'

          ## Installation

          ### Windows
          1. 下载 `keyword-windows-x64.zip`
          2. 解压后直接运行 `keyword.exe`

          ### macOS
          1. 下载 `keyword-macos-universal.tar.gz`
          2. 解压后运行 `keyword`
          3. 如果遇到 Gatekeeper 拦截，执行：`xattr -d com.apple.quarantine keyword`

          ### Linux
          1. 下载 `keyword-linux-x64.tar.gz`
          2. 解压后运行 `keyword`

          ## Verify Checksums

          下载 SHA256SUMS.txt 并验证：

          ```bash
          sha256sum -c SHA256SUMS.txt
          ```
          EOF

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
